name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a & armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ninmods (client.sh)
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1
          echo "=== Contents of ninmods after build ==="
          ls -la
          echo "=== Contents of libs if exists ==="
          ls -la libs/ || true
          ls -la libs/arm64-v8a/ || true

      - name: Verify Output Binary
        run: |
          echo "=== Current working directory and find client.sh ==="
          pwd
          find . -name "client.sh" -ls

          TARGET_FILE=$(find . -name "client.sh" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            echo "Found compiled client.sh at: $TARGET_FILE"
            mkdir -p output_binaries
            cp "$TARGET_FILE" output_binaries/client.sh
            ls -lh output_binaries/client.sh
          else
            echo "ERROR: client.sh not generated anywhere!"
            exit 1
          fi

      - name: Upload client.sh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: output_binaries/client.sh
          if-no-files-found: error
