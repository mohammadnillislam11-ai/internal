name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build client.sh
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1
          echo "=== PWD AND LS AFTER BUILD ==="
          pwd
          ls -la
          ls -la libs/ || true
          ls -la libs/arm64-v8a/ || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ninmods/build.log

      - name: Verify Output Binary
        run: |
          echo "=== SEARCHING FOR COMPILED BINARIES ==="
          find ninmods -type f -name "client*" || true
          find . -type f -name "client*" || true

          if [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            echo "Build SUCCESS!"
            ls -lh ninmods/libs/arm64-v8a/client.sh
            file ninmods/libs/arm64-v8a/client.sh
          elif [ -f libs/arm64-v8a/client.sh ]; then
            echo "Found in root libs/arm64-v8a/client.sh, moving to ninmods/libs/arm64-v8a/..."
            mkdir -p ninmods/libs/arm64-v8a
            cp libs/arm64-v8a/client.sh ninmods/libs/arm64-v8a/client.sh
            ls -lh ninmods/libs/arm64-v8a/client.sh
          else
            echo "Binary not found!"
            find . -type f
            exit 1
          fi

      - name: Upload client.sh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: ninmods/libs/arm64-v8a/client.sh
          if-no-files-found: error
