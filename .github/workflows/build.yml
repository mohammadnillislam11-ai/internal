name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build client.sh
        run: |
          cd refer/ZqwClient
          chmod +x compile.sh h.sh 2>/dev/null || true
          ndk-build -B V=1

      - name: Verify Output Binary
        run: |
          if [ -f refer/ZqwClient/libs/arm64-v8a/client.sh ]; then
            echo "Build SUCCESS!"
            ls -lh refer/ZqwClient/libs/arm64-v8a/client.sh
            file refer/ZqwClient/libs/arm64-v8a/client.sh
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Upload client.sh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: refer/ZqwClient/libs/arm64-v8a/client.sh
          if-no-files-found: error
