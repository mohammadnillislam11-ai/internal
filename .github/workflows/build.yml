name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-ABI Android Binaries & Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build gemini-cli.sh (arm64-v8a & armeabi-v7a)
        run: |
          set -o pipefail
          cd ninmods
          chmod +x compile.sh 2>/dev/null || true
          if ! ndk-build -B V=1 2>&1 | tee build.log; then
            echo "=== NDK BUILD ERROR LOG ==="
            tail -n 100 build.log
            grep -E "error:" build.log | head -n 25 | while read -r errline; do
              echo "::error title=NDK Error::$errline"
            done
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ninmods/build.log

      - name: Verify Output Binaries
        run: |
          echo "Verifying 64-bit arm64-v8a gemini-cli.sh..."
          if [ -f ninmods/libs/arm64-v8a/gemini-cli.sh ]; then
            echo "[OK] 64-bit gemini-cli.sh built successfully!"
            chmod +x ninmods/libs/arm64-v8a/gemini-cli.sh
            ls -lh ninmods/libs/arm64-v8a/gemini-cli.sh
          elif [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            cp ninmods/libs/arm64-v8a/client.sh ninmods/libs/arm64-v8a/gemini-cli.sh
            chmod +x ninmods/libs/arm64-v8a/gemini-cli.sh
            ls -lh ninmods/libs/arm64-v8a/gemini-cli.sh
          else
            echo "[ERROR] 64-bit arm64-v8a gemini-cli.sh not found!"
            exit 1
          fi

          echo "Verifying 32-bit armeabi-v7a gemini-cli.sh..."
          if [ -f ninmods/libs/armeabi-v7a/gemini-cli.sh ]; then
            echo "[OK] 32-bit gemini-cli.sh built successfully!"
            chmod +x ninmods/libs/armeabi-v7a/gemini-cli.sh
            ls -lh ninmods/libs/armeabi-v7a/gemini-cli.sh
          elif [ -f ninmods/libs/armeabi-v7a/client.sh ]; then
            cp ninmods/libs/armeabi-v7a/client.sh ninmods/libs/armeabi-v7a/gemini-cli.sh
            chmod +x ninmods/libs/armeabi-v7a/gemini-cli.sh
            ls -lh ninmods/libs/armeabi-v7a/gemini-cli.sh
          else
            echo "[ERROR] 32-bit armeabi-v7a gemini-cli.sh not found!"
            exit 1
          fi

      - name: Upload gemini-cli.sh (64-bit arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-cli-arm64
          path: ninmods/libs/arm64-v8a/gemini-cli.sh
          if-no-files-found: error

      - name: Upload gemini-cli.sh (32-bit armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-cli-arm32
          path: ninmods/libs/armeabi-v7a/gemini-cli.sh
          if-no-files-found: error

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package Native Engine into Gemini App Assets
        run: |
          mkdir -p ninmods/app/src/main/assets
          cp ninmods/libs/arm64-v8a/gemini-cli.sh ninmods/app/src/main/assets/gemini-engine-arm64
          cp ninmods/libs/armeabi-v7a/gemini-cli.sh ninmods/app/src/main/assets/gemini-engine-arm32
          ls -lh ninmods/app/src/main/assets/

      - name: Build Standalone Gemini APK (com.google.android.gemini)
        run: |
          set -o pipefail
          cd ninmods
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          if ! ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_gemini.log; then
            echo "=== GEMINI GRADLE BUILD ERROR ==="
            tail -n 150 gradle_gemini.log
            exit 1
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../gemini_standalone_release.apk
            ls -lh ../gemini_standalone_release.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../gemini_standalone_release.apk
            ls -lh ../gemini_standalone_release.apk
          else
            echo "Searching for built APK:"
            find . -name "*.apk"
            exit 1
          fi
          cd ..

      - name: Upload Gemini Standalone APK (com.google.android.gemini)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-standalone-apk
          path: gemini_standalone_release.apk
          if-no-files-found: error

      - name: Build Unlocked NEXOMODSROOT APK
        run: |
          set -o pipefail
          cd refer/NEXOMODSROOT
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          if ! ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle.log; then
            echo "=== NEXO GRADLE BUILD ERROR ==="
            tail -n 150 gradle.log
            exit 1
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../../nexo_unlocked.apk
            ls -lh ../../nexo_unlocked.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../../nexo_unlocked.apk
            ls -lh ../../nexo_unlocked.apk
          else
            echo "Searching for built APK:"
            find . -name "*.apk"
            exit 1
          fi
          cd ../..

      - name: Upload NEXOMODS Gradle Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-gradle-failure-log
          path: refer/NEXOMODSROOT/gradle.log
          if-no-files-found: ignore

      - name: Upload Unlocked NEXOMODSROOT APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-unlocked-apk
          path: nexo_unlocked.apk
          if-no-files-found: error
