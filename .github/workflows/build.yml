name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a & armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ninmods (client.sh)
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1
          echo "=== Check ninmods directory ==="
          ls -R libs/ || true

      - name: Verify Output Binary
        run: |
          echo "=== Search entire repository ==="
          find ninmods/libs -type f || true
          if [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            echo "SUCCESS: ninmods/libs/arm64-v8a/client.sh exists!"
            mkdir -p output_binaries
            cp ninmods/libs/arm64-v8a/client.sh output_binaries/client.sh
          elif [ -f ninmods/libs/arm64-v8a/client.sh.so ]; then
            echo "Found with .so extension!"
            mkdir -p output_binaries
            cp ninmods/libs/arm64-v8a/client.sh.so output_binaries/client.sh
          else
            echo "=== Listing all files inside ninmods ==="
            find ninmods -type f -name "*client*" || true
            find ninmods/libs -type f || true
            exit 1
          fi

      - name: Upload client.sh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: output_binaries/client.sh
          if-no-files-found: error
