name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a & armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ninmods (Multi-ABI client.sh)
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1

      - name: Verify Output Binaries
        run: |
          echo "=== Root Directory Listing ==="
          ls -la
          echo "=== ninmods Directory Listing ==="
          ls -la ninmods
          if [ -d ninmods/libs ]; then
            echo "=== ninmods/libs Content ==="
            find ninmods/libs -type f
          fi
          if [ -d libs ]; then
            echo "=== root libs Content ==="
            find libs -type f
            mkdir -p ninmods/libs
            cp -r libs/* ninmods/libs/
          fi

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninmods-client
          path: |
            ninmods/libs/*/client.sh
            libs/*/client.sh
          if-no-files-found: warn
