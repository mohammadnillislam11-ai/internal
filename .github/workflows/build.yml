name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multi-ABI Android Binaries (arm64-v8a & armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build client.sh (arm64-v8a & armeabi-v7a)
        run: |
          set -o pipefail
          cd ninmods
          chmod +x compile.sh 2>/dev/null || true
          ndk-build -B V=1 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ninmods/build.log

      - name: Verify Output Binaries
        run: |
          echo "Verifying 64-bit arm64-v8a client.sh..."
          if [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            echo "[OK] 64-bit client.sh built successfully!"
            ls -lh ninmods/libs/arm64-v8a/client.sh
            file ninmods/libs/arm64-v8a/client.sh
          else
            echo "[ERROR] 64-bit arm64-v8a client.sh not found!"
            exit 1
          fi

          echo "Verifying 32-bit armeabi-v7a client.sh..."
          if [ -f ninmods/libs/armeabi-v7a/client.sh ]; then
            echo "[OK] 32-bit client.sh built successfully!"
            ls -lh ninmods/libs/armeabi-v7a/client.sh
            file ninmods/libs/armeabi-v7a/client.sh
          else
            echo "[ERROR] 32-bit armeabi-v7a client.sh not found!"
            exit 1
          fi

      - name: Upload client.sh (64-bit arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: ninmods/libs/arm64-v8a/client.sh
          if-no-files-found: error

      - name: Upload client.sh (32-bit armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm32
          path: ninmods/libs/armeabi-v7a/client.sh
          if-no-files-found: error
