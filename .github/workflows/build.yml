name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a & armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ninmods (Multi-ABI client.sh)
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ninmods/build.log

      - name: Verify Output Binaries
        run: |
          echo "=== Checking arm64-v8a ==="
          if [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            ls -lh ninmods/libs/arm64-v8a/client.sh
            file ninmods/libs/arm64-v8a/client.sh
          else
            echo "arm64-v8a binary not found!"
            exit 1
          fi

          echo "=== Checking armeabi-v7a ==="
          if [ -f ninmods/libs/armeabi-v7a/client.sh ]; then
            ls -lh ninmods/libs/armeabi-v7a/client.sh
            file ninmods/libs/armeabi-v7a/client.sh
          else
            echo "armeabi-v7a binary not found!"
            exit 1
          fi

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninmods-binaries
          path: ninmods/libs/
