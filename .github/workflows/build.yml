name: Build NINMODS Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64-v8a & armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build ninmods (client.sh)
        run: |
          cd ninmods
          chmod +x compile.sh run.sh 2>/dev/null || true
          ndk-build -B V=1 2>&1 | tee build_output.log || {
            echo "=== NDK BUILD FAILED, LAST 80 LINES ==="
            tail -n 80 build_output.log
            exit 1
          }

      - name: Verify Output Binary
        run: |
          if [ -f ninmods/libs/arm64-v8a/client.sh ]; then
            echo "Build SUCCESS!"
            ls -lh ninmods/libs/arm64-v8a/client.sh
            file ninmods/libs/arm64-v8a/client.sh
          elif [ -f libs/arm64-v8a/client.sh ]; then
            echo "Found in root libs/:"
            mkdir -p ninmods/libs/arm64-v8a
            cp libs/arm64-v8a/client.sh ninmods/libs/arm64-v8a/
            ls -lh ninmods/libs/arm64-v8a/client.sh
          else
            echo "Searching for client.sh:"
            find . -name "client.sh"
            exit 1
          fi

      - name: Upload client.sh Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client.sh-arm64
          path: ninmods/libs/arm64-v8a/client.sh
          if-no-files-found: error
